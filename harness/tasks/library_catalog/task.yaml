# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: library_catalog
family: library_catalog
split: dev
entry_files: [library.py]
spec: spec.md
public_checks: [public/test_library_public.py]
private_tests: [private/test_library_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_refused_check_out_in_history, must_fail: [initial], must_pass: [public]}
  - {path: bugs/v0_adding_copies_clears_history, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_one_copy
    kind: validation_rule
    request: changes/c_one_copy/request.md
    public_checks: [changes/c_one_copy/public/test_one_copy_public.py]
    new_feature_tests: [changes/c_one_copy/private/test_one_copy_new.py]
  - id: c_reservations
    kind: atomic_operation
    request: changes/c_reservations/request.md
    public_checks: [changes/c_reservations/public/test_reservations_public.py]
    new_feature_tests: [changes/c_reservations/private/test_reservations_new.py]
  - id: c_loan_log
    kind: query
    request: changes/c_loan_log/request.md
    public_checks: [changes/c_loan_log/public/test_loan_log_public.py]
    new_feature_tests: [changes/c_loan_log/private/test_loan_log_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_one_copy: reference/one_copy
  c_one_copy+c_reservations: reference/one_copy_reservations
  c_loan_log: reference/loan_log
  c_loan_log+c_one_copy: reference/loan_log_one_copy

sequences:
  - id: s1
    steps:
      - change: c_one_copy
      - change: c_reservations
        planted_bugs:
          - path: bugs/reservations_allow_second_copy  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_loan_log
      - change: c_one_copy
        planted_bugs:
          - path: bugs/one_copy_logs_refused_check_out  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
