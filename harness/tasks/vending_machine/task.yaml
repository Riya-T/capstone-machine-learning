# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: vending_machine
family: vending_machine
split: train
entry_files: [vending.py]
spec: spec.md
public_checks: [public/test_vending_public.py]
private_tests: [private/test_vending_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_credit_checked_before_stock, must_fail: [initial], must_pass: [public]}
  - {path: bugs/v0_change_not_cleared, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_capacity
    kind: validation_rule
    request: changes/c_capacity/request.md
    public_checks: [changes/c_capacity/public/test_capacity_public.py]
    new_feature_tests: [changes/c_capacity/private/test_capacity_new.py]
  - id: c_sales
    kind: derived_value
    request: changes/c_sales/request.md
    public_checks: [changes/c_sales/public/test_sales_public.py]
    new_feature_tests: [changes/c_sales/private/test_sales_new.py]
  - id: c_outage
    kind: state_flag
    request: changes/c_outage/request.md
    public_checks: [changes/c_outage/public/test_outage_public.py]
    new_feature_tests: [changes/c_outage/private/test_outage_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_capacity: reference/capacity
  c_capacity+c_sales: reference/capacity_sales
  c_outage: reference/outage
  c_capacity+c_outage: reference/capacity_outage

sequences:
  - id: s1
    steps:
      - change: c_capacity
      - change: c_sales
        planted_bugs:
          - path: bugs/sales_drop_capacity_check  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_outage
      - change: c_capacity
        planted_bugs:
          - path: bugs/capacity_ignores_disabled  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
