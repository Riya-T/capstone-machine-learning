# Comment ablation for the maintainability prompt: rtx5070_eval_maintain.yaml
# with the editor seeing each program without its comments and docstrings
# (editor.view_transform: strip_comments). See rtx5070_eval_nocomments.yaml.
#
# Usage (from harness/, inside WSL):
#     uv run python -m harness collect --config configs/rtx5070_eval_maintain_nocomments.yaml
#     uv run python scripts/eval_compare.py --base configs/rtx5070_eval_maintain.yaml \
#         --other configs/rtx5070_eval_maintain_nocomments.yaml
extends: rtx5070_eval_maintain.yaml
name: rtx5070-eval-maintain-nocomments
editor:
  view_transform: strip_comments
