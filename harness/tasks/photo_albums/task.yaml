# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
# History suite (HISTORY_SUITE.md): U = c_undo, B = c_album_limit,
# C = c_move_many.
schema_version: 1
id: photo_albums
family: photo_albums
split: dev
entry_files: [albums.py]
spec: spec.md
public_checks: [public/test_albums_public.py]
private_tests: [private/test_albums_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_delete_puts_photos_first, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_album_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_album_undo_new.py]
  - id: c_album_limit
    kind: validation_rule
    request: changes/c_album_limit/request.md
    public_checks: [changes/c_album_limit/public/test_album_limit_public.py]
    new_feature_tests: [changes/c_album_limit/private/test_album_limit_new.py]
  - id: c_move_many
    kind: atomic_operation
    request: changes/c_move_many/request.md
    public_checks: [changes/c_move_many/public/test_move_many_public.py]
    new_feature_tests: [changes/c_move_many/private/test_move_many_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_album_limit+c_undo: reference/album_limit_undo
  c_move_many: reference/move_many
  c_move_many+c_undo: reference/move_many_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_album_limit
        planted_bugs:
          - path: bugs/album_limit_move_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_move_many
      - change: c_undo
        planted_bugs:
          - path: bugs/move_many_moves_one_at_a_time  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
