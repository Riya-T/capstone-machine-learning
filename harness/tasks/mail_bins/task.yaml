# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: mail_bins
family: mail_bins
split: train
entry_files: [sorting.py]
spec: spec.md
public_checks: [public/test_sorting_public.py]
private_tests: [private/test_sorting_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_drop_checks_only_its_own_bin, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_accepts
    kind: validation_rule
    request: changes/c_accepts/request.md
    public_checks: [changes/c_accepts/public/test_accepts_public.py]
    new_feature_tests: [changes/c_accepts/private/test_accepts_new.py]
  - id: c_lookup
    kind: query
    request: changes/c_lookup/request.md
    public_checks: [changes/c_lookup/public/test_lookup_public.py]
    new_feature_tests: [changes/c_lookup/private/test_lookup_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_accepts+c_undo: reference/undo_accepts
  c_lookup: reference/lookup
  c_lookup+c_undo: reference/lookup_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_accepts
        planted_bugs:
          - path: bugs/accepts_close_bin_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_lookup
      - change: c_undo
        planted_bugs:
          - path: bugs/undo_close_bin_reverses_order  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
