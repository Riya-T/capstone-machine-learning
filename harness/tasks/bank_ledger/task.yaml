# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: bank_ledger
family: bank_ledger
split: dev
entry_files: [ledger.py]
spec: spec.md
public_checks: [public/test_ledger_public.py]
private_tests: [private/test_ledger_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_same_account_transfer, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_overdraft
    kind: validation_rule
    request: changes/c_overdraft/request.md
    public_checks: [changes/c_overdraft/public/test_overdraft_public.py]
    new_feature_tests: [changes/c_overdraft/private/test_overdraft_new.py]
  - id: c_fees
    kind: derived_value
    request: changes/c_fees/request.md
    public_checks: [changes/c_fees/public/test_fees_public.py]
    new_feature_tests: [changes/c_fees/private/test_fees_new.py]
  - id: c_freeze
    kind: state_flag
    request: changes/c_freeze/request.md
    public_checks: [changes/c_freeze/public/test_freeze_public.py]
    new_feature_tests: [changes/c_freeze/private/test_freeze_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_overdraft: reference/overdraft
  c_fees+c_overdraft: reference/fees_overdraft
  c_freeze: reference/freeze
  c_freeze+c_overdraft: reference/freeze_overdraft

sequences:
  - id: s1
    steps:
      - change: c_overdraft
      - change: c_fees
        planted_bugs:
          - path: bugs/fees_drop_limit_check  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_freeze
      - change: c_overdraft
        planted_bugs:
          - path: bugs/overdraft_ignores_freeze  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
