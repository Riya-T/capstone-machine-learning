# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: course_enrollment
family: course_enrollment
split: dev
entry_files: [enrollment.py]
spec: spec.md
public_checks: [public/test_enrollment_public.py]
private_tests: [private/test_enrollment_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_full_checked_before_duplicate, must_fail: [initial], must_pass: [public]}
  - {path: bugs/v0_accepts_zero_capacity, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_prerequisites
    kind: validation_rule
    request: changes/c_prerequisites/request.md
    public_checks: [changes/c_prerequisites/public/test_prerequisites_public.py]
    new_feature_tests: [changes/c_prerequisites/private/test_prerequisites_new.py]
  - id: c_waitlist
    kind: undo
    request: changes/c_waitlist/request.md
    public_checks: [changes/c_waitlist/public/test_waitlist_public.py]
    new_feature_tests: [changes/c_waitlist/private/test_waitlist_new.py]
  - id: c_freeze
    kind: state_flag
    request: changes/c_freeze/request.md
    public_checks: [changes/c_freeze/public/test_freeze_public.py]
    new_feature_tests: [changes/c_freeze/private/test_freeze_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_prerequisites: reference/prerequisites
  c_prerequisites+c_waitlist: reference/prerequisites_waitlist
  c_freeze: reference/freeze
  c_freeze+c_prerequisites: reference/freeze_prerequisites

sequences:
  - id: s1
    steps:
      - change: c_prerequisites
      - change: c_waitlist
        planted_bugs:
          - path: bugs/waitlist_full_before_prerequisites  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_freeze
      - change: c_prerequisites
        planted_bugs:
          - path: bugs/prerequisites_freeze_checked_late  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
