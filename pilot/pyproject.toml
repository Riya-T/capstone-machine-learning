[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "noahd223", email = "noahd3485@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: needs a running Docker daemon (skipped otherwise)",
    "local_model: calls the model server in configs/pilot_local.yaml (skipped unless --local-model)",
    "slow: takes tens of seconds or more (skipped unless --slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
