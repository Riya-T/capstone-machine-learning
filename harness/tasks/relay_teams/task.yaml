# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
# History suite (see ../HISTORY_SUITE.md): undo in both sequences.
schema_version: 1
id: relay_teams
family: relay_teams
split: train
entry_files: [relay.py]
spec: spec.md
public_checks: [public/test_relay_public.py]
private_tests: [private/test_relay_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_move_to_own_team_allowed, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_limit
    kind: validation_rule
    request: changes/c_limit/request.md
    public_checks: [changes/c_limit/public/test_limit_public.py]
    new_feature_tests: [changes/c_limit/private/test_limit_new.py]
  - id: c_transfer
    kind: atomic_operation
    request: changes/c_transfer/request.md
    public_checks: [changes/c_transfer/public/test_transfer_public.py]
    new_feature_tests: [changes/c_transfer/private/test_transfer_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_limit+c_undo: reference/limit_undo
  c_transfer: reference/transfer
  c_transfer+c_undo: reference/transfer_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_limit
        planted_bugs:
          - path: bugs/limit_merge_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_transfer
      - change: c_undo
        planted_bugs:
          - path: bugs/transfer_moves_some  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
