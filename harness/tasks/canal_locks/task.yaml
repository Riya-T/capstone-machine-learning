# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: canal_locks
family: canal_locks
split: eval
entry_files: [canals.py]
spec: spec.md
public_checks: [public/test_canals_public.py]
private_tests: [private/test_canals_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_merge_keeps_duplicates, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_limits
    kind: validation_rule
    request: changes/c_limits/request.md
    public_checks: [changes/c_limits/public/test_limits_public.py]
    new_feature_tests: [changes/c_limits/private/test_limits_new.py]
  - id: c_reachable
    kind: query
    request: changes/c_reachable/request.md
    public_checks: [changes/c_reachable/public/test_reachable_public.py]
    new_feature_tests: [changes/c_reachable/private/test_reachable_new.py]
  - id: c_versions
    kind: concurrency_control
    request: changes/c_versions/request.md
    public_checks: [changes/c_versions/public/test_versions_public.py]
    new_feature_tests: [changes/c_versions/private/test_versions_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_limits+c_undo: reference/limits_undo
  c_limits+c_undo+c_versions: reference/limits_undo_versions
  c_reachable: reference/reachable
  c_reachable+c_undo: reference/reachable_undo
  c_limits+c_reachable+c_undo: reference/limits_reachable_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_limits
      - change: c_versions
        planted_bugs:
          - path: bugs/versions_merge_ignores_limit  # required regression bug: breaks step 2
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_reachable
      - change: c_undo
      - change: c_limits
        planted_bugs:
          - path: bugs/limits_merge_not_undoable  # required regression bug: breaks step 2
            must_fail: [existing]
            must_pass: [new_feature]
