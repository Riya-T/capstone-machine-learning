# Shared settings for the harness. Variants extend this file and override
# only what differs. Paths are relative to this directory.
schema_version: 1
name: harness-base
seed: 20261014
allow_dirty: true            # runs may start with uncommitted changes; each run records that it did
runs_dir: ../runs
tasks:
  dir: ../tasks
  include: []                # each variant lists its tasks
  sequences_per_task: 2      # proposal: two different change sequences
  # The kinds of change a task may contain (each change's `kind`). The
  # eval-only kinds appear only in eval tasks, so evaluation tests kinds of
  # change the writer never saw in training or calibration.
  change_kinds:
    - validation_rule        # a new constraint on inputs (unique emails, limits)
    - state_flag             # a status that changes what's allowed (freezing, injuries)
    - atomic_operation       # several changes that succeed or fail together (trades)
    - undo                   # removing or reversing something already recorded
    - derived_value          # a new value computed from existing data (fees, streaks)
    - grouping               # splitting items into categories (divisions)
    - query                  # new ways to search or filter existing data
    - configuration          # making a fixed rule adjustable (custom points)
    - concurrency_control    # detecting conflicting updates (version numbers)
  eval_only_kinds: [configuration, concurrency_control]
  sequence_length:           # changes per sequence, by split
    train: 2
    dev: 2
    eval: 3
  # Proposal: up to eight candidates per task. The writer samples 16 (below)
  # and the first 8 distinct passing programs go on to editing, so editing
  # cost matches the proposal's estimate. See "Changes from the proposal" in
  # the top-level README.
  max_programs: 8

writer:
  samples_per_task: 16       # the 7B writer passes ~4 of 8 on dev tasks; 16 reaches more
  prompt_template: ../prompts/writer_v1.md
  backend:
    kind: mock
    model: mock-writer
    fixtures: ../fixtures/mock/writer.yaml
    temperature: 0.8         # diverse candidates are the point of sampling
    max_tokens: 4096

editor:
  scaffold: turn_loop        # see src/harness/collection/editor.py
  reps: 3                    # proposal: each sequence repeated three times
  view_transform: none       # strip_comments (comment ablation) not implemented yet
  history_turns: 3           # one-line summaries of the latest turns in each prompt
  prompt_template: ../prompts/editor_v2.md
  # Context is 8192 tokens: a prompt of at most ~16k characters (~4.5k tokens)
  # leaves room for a 3072-token reply.
  max_prompt_chars: 16000
  max_check_output_chars: 2000
  budget:
    max_turns: 8
    max_total_tokens: 32000
    wall_time_s: 600
  backend:
    kind: mock
    model: mock-editor
    fixtures: ../fixtures/mock/editor.yaml
    temperature: 0.7         # > 0 so repetitions can differ
    max_tokens: 3072         # with max_prompt_chars, fits the 8192-token context

sandbox:
  image: harness-sandbox:py3.11-v1   # change the tag whenever docker/sandbox/Dockerfile changes
  build_context: ../docker/sandbox
  timeout_s: 60
  memory: 512m
  cpus: 1.0
  pids_limit: 128
  tmpfs_size: 64m
  output_cap_bytes: 65536

execution:                   # how work runs; never part of a result key
  sandbox_workers: 4         # containers at once; 4 x (1 cpu, 512m) fits the 8-core laptop

scorer:
  rule: weak_dominance       # primary; frozen after dev tasks
  # best_vs_worst gives at most one pair per task (36 at most), short of the
  # proposal's 100-300; all_pairs with a cap reaches it without letting a few
  # tasks dominate (36 x 8 = 288 at most).
  pairing_mode: all_pairs
  per_task_cap: 8
