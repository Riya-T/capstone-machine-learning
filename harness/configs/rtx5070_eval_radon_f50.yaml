# Label-noise control on the 16 eval tasks, writer side only: the Radon
# baseline (rtx5070_eval_radon.yaml) retrained with 50% of its 160 matched
# pairs swapped (scripts/flip_pairs.py --rate 0.50, seed 20261116), with
# dpo3's settings, and served like writer-radon-ctx8k as
# writer-radon_f50-ctx8k. Only the writer's samples and the initial checks
# are run (--until initial); scripts/winner_features.py then compares the
# code against the base writer's (rtx5070_eval.yaml), as for the Radon
# writer, whose labels are never swapped.
#
# Usage (from harness/, inside WSL):
#     uv run python -m harness collect --config configs/rtx5070_eval_radon_f50.yaml --until initial
extends: rtx5070_eval.yaml
name: rtx5070-eval-radon-f50
writer:
  backend:
    model: writer-radon_f50-ctx8k
