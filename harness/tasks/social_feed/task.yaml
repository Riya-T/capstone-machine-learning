# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: social_feed
family: social_feed
split: eval
entry_files: [feed.py]
spec: spec.md
public_checks: [public/test_feed_public.py]
private_tests: [private/test_feed_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_self_follow, must_fail: [initial], must_pass: [public]}
  - {path: bugs/v0_failed_post_uses_id, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_post_limit
    kind: configuration
    request: changes/c_post_limit/request.md
    public_checks: [changes/c_post_limit/public/test_limit_public.py]
    new_feature_tests: [changes/c_post_limit/private/test_limit_new.py]
  - id: c_block
    kind: state_flag
    request: changes/c_block/request.md
    public_checks: [changes/c_block/public/test_block_public.py]
    new_feature_tests: [changes/c_block/private/test_block_new.py]
  - id: c_mentions
    kind: query
    request: changes/c_mentions/request.md
    public_checks: [changes/c_mentions/public/test_mentions_public.py]
    new_feature_tests: [changes/c_mentions/private/test_mentions_new.py]
  - id: c_edits
    kind: concurrency_control
    request: changes/c_edits/request.md
    public_checks: [changes/c_edits/public/test_edits_public.py]
    new_feature_tests: [changes/c_edits/private/test_edits_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_post_limit: reference/limit
  c_block+c_post_limit: reference/block_limit
  c_block+c_mentions+c_post_limit: reference/block_limit_mentions
  c_edits: reference/edits
  c_edits+c_post_limit: reference/edits_limit
  c_block+c_edits+c_post_limit: reference/block_edits_limit

sequences:
  - id: s1
    steps:
      - change: c_post_limit
      - change: c_block
        planted_bugs:
          - path: bugs/block_set_limit_unchecked  # breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
      - change: c_mentions
        planted_bugs:
          - path: bugs/mentions_block_one_way  # required regression bug: breaks step 2
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_edits
      - change: c_post_limit
        planted_bugs:
          - path: bugs/limit_version_before_text  # breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
      - change: c_block
        planted_bugs:
          - path: bugs/block_edit_skips_version_check  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
