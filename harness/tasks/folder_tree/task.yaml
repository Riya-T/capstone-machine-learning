# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: folder_tree
family: folder_tree
split: train
entry_files: [folders.py]
spec: spec.md
public_checks: [public/test_folders_public.py]
private_tests: [private/test_folders_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_deleted_folder_still_usable, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_folders_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_folders_undo_new.py]
  - id: c_subfolder_limit
    kind: validation_rule
    request: changes/c_subfolder_limit/request.md
    public_checks: [changes/c_subfolder_limit/public/test_folders_subfolder_limit_public.py]
    new_feature_tests: [changes/c_subfolder_limit/private/test_folders_subfolder_limit_new.py]
  - id: c_lookup
    kind: query
    request: changes/c_lookup/request.md
    public_checks: [changes/c_lookup/public/test_folders_lookup_public.py]
    new_feature_tests: [changes/c_lookup/private/test_folders_lookup_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_subfolder_limit+c_undo: reference/subfolder_limit_undo
  c_lookup: reference/lookup
  c_lookup+c_undo: reference/lookup_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_subfolder_limit
        planted_bugs:
          - path: bugs/subfolder_limit_move_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_lookup
      - change: c_undo
        planted_bugs:
          - path: bugs/undo_all_files_lists_subfolders_first  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
