[project]
name = "harness"
version = "0.1.0"
description = "Collects later-edit preference data for training a code writer (see ../docs/Project_Proposal_473_v2.docx.pdf)"
authors = [
    { name = "noahd223", email = "noahd3485@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
]

[project.optional-dependencies]
training = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.44,<1",
    "datasets>=3.0,<5",
    "peft>=0.14,<1",
    "torch>=2.4,<3",
    "transformers>=4.46,<5",
    "trl>=0.15,<1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: needs a running Docker daemon (skipped otherwise)",
    "apptainer: needs the apptainer CLI (skipped otherwise; builds the SIF if missing)",
    "slow: takes tens of seconds or more (skipped unless --slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
