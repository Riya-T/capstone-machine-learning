# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
# History suite (see ../HISTORY_SUITE.md): undo in both sequences.
schema_version: 1
id: garden_beds
family: garden_beds
split: train
entry_files: [garden.py]
spec: spec.md
public_checks: [public/test_garden_public.py]
private_tests: [private/test_garden_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_unseen_species_key_error, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_allowed
    kind: validation_rule
    request: changes/c_allowed/request.md
    public_checks: [changes/c_allowed/public/test_allowed_public.py]
    new_feature_tests: [changes/c_allowed/private/test_allowed_new.py]
  - id: c_lookup
    kind: query
    request: changes/c_lookup/request.md
    public_checks: [changes/c_lookup/public/test_lookup_public.py]
    new_feature_tests: [changes/c_lookup/private/test_lookup_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_allowed+c_undo: reference/allowed_undo
  c_lookup: reference/lookup
  c_lookup+c_undo: reference/lookup_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_allowed
        planted_bugs:
          - path: bugs/allowed_clear_bed_saved_too_late  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_lookup
      - change: c_undo
        planted_bugs:
          - path: bugs/lookup_beds_sorted  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
