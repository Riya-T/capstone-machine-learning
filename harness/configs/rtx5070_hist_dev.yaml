# History suite, dev tasks, the plain writer prompt (no design hints) and
# the editor prompt that asks the editor to build on the program's design.
# Used to choose training settings for the history suite.
#
# Usage (from harness/, inside WSL):
#     uv run python -m harness collect --config configs/rtx5070_hist_dev.yaml
extends: rtx5070_pc_editor_v3.yaml
name: rtx5070-hist-dev
tasks:
  include: [seed_vault, choir_sections, tram_lines, photo_albums]
sandbox:
  timeout_s: 180   # room for a loaded machine; the same for every history-suite config
editor:
  reps: 2          # history-suite trials take 2-5 minutes; 2 reps per sequence
