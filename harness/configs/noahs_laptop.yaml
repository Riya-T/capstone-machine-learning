# ============================================================================
# This is for Noah's laptop testing (noahd223 github user)
#
# Hardware: NVIDIA GeForce RTX 4060 Laptop GPU (8 GB), 8 CPU cores, 11 GB RAM.
# Use it for cheap early checks on the dev tasks, such as whether the writer's
# programs pass the hidden initial tests at all. Results from it never go into
# the training data or the report: the 7B model stands in for the 14B editor,
# and the context is small to fit 8 GB. 
# ============================================================================
#
# Setup (once): Ollama with Qwen2.5-Coder-7B-Instruct and an 8192-token
# context variant. Ollama's OpenAI-compatible endpoint can't set the context
# per request, so it is fixed in a named variant (no new download):
#
#     ollama pull qwen2.5-coder:7b-instruct
#     curl -s http://localhost:11434/api/create -d '{"model": "qwen2.5-coder-7b-ctx8k",
#         "from": "qwen2.5-coder:7b-instruct", "parameters": {"num_ctx": 8192}}'
#
# Usage (from harness/):
#     uv run python -m harness collect --config configs/noahs_laptop.yaml --until initial
#     uv run python -m harness collect --config configs/noahs_laptop.yaml      # also edit
extends: base.yaml
name: noahs-laptop
runs_dir: ../runs/noahs_laptop  # its own store, apart from every other config
tasks:
  include: [chat_rooms]
writer:
  backend:
    kind: openai_compat
    model: qwen2.5-coder-7b-ctx8k
    base_url: http://localhost:11434/v1
    fixtures: null           # clear the mock fixtures inherited from base.yaml
    temperature: 0.4         # the pilot: 0.8 gave 0 of 16 passing, 0.4 gave 6 of 16
    request_timeout_s: 600   # a 7B model on 8 GB can take minutes for a long answer
editor:
  backend:
    kind: openai_compat
    model: qwen2.5-coder-7b-ctx8k  # stand-in for the 14B editor
    base_url: http://localhost:11434/v1
    fixtures: null
    request_timeout_s: 600
execution:
  sandbox_workers: 4         # leaves CPU for Ollama
