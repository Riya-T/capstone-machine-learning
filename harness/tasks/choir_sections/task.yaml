# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
# History suite (HISTORY_SUITE.md): U = c_undo, B = c_limit, C = c_find.
schema_version: 1
id: choir_sections
family: choir_sections
split: dev
entry_files: [choir.py]
spec: spec.md
public_checks: [public/test_choir_public.py]
private_tests: [private/test_choir_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_move_all_keeps_index, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_choir_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_choir_undo_new.py]
  - id: c_limit
    kind: validation_rule
    request: changes/c_limit/request.md
    public_checks: [changes/c_limit/public/test_choir_limit_public.py]
    new_feature_tests: [changes/c_limit/private/test_choir_limit_new.py]
  - id: c_find
    kind: query
    request: changes/c_find/request.md
    public_checks: [changes/c_find/public/test_choir_find_public.py]
    new_feature_tests: [changes/c_find/private/test_choir_find_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_limit+c_undo: reference/limit_undo
  c_find: reference/find
  c_find+c_undo: reference/find_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_limit
        planted_bugs:
          - path: bugs/limit_move_saved_too_late  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_find
      - change: c_undo
        planted_bugs:
          - path: bugs/undo_position_from_zero  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
