# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: bus_routes
family: bus_routes
split: train
entry_files: [network.py]
spec: spec.md
public_checks: [public/test_network_public.py]
private_tests: [private/test_network_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_split_missing_stop_value_error, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_lock
    kind: state_flag
    request: changes/c_lock/request.md
    public_checks: [changes/c_lock/public/test_lock_public.py]
    new_feature_tests: [changes/c_lock/private/test_lock_new.py]
  - id: c_add_stops
    kind: atomic_operation
    request: changes/c_add_stops/request.md
    public_checks: [changes/c_add_stops/public/test_add_stops_public.py]
    new_feature_tests: [changes/c_add_stops/private/test_add_stops_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_lock+c_undo: reference/undo_lock
  c_add_stops: reference/add_stops
  c_add_stops+c_undo: reference/add_stops_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_lock
        planted_bugs:
          - path: bugs/lock_retire_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_add_stops
      - change: c_undo
        planted_bugs:
          - path: bugs/undo_add_stops_not_atomic  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
