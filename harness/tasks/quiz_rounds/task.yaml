# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
#
# History suite (HISTORY_SUITE.md): question ids in ordered rounds, with
# composites that move or remove many questions (merge_rounds, drop_round).
# The undo change must take back a composite call as one call and put
# removed questions and rounds back at their old positions, which a
# recorded history or a copy of the state gets right for free.
schema_version: 1
id: quiz_rounds
family: quiz_rounds
split: train
entry_files: [quiz.py]
spec: spec.md
public_checks: [public/test_quiz_public.py]
private_tests: [private/test_quiz_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_dropped_ids_stay_taken, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_limit
    kind: validation_rule
    request: changes/c_limit/request.md
    public_checks: [changes/c_limit/public/test_limit_public.py]
    new_feature_tests: [changes/c_limit/private/test_limit_new.py]
  - id: c_move_many
    kind: atomic_operation
    request: changes/c_move_many/request.md
    public_checks: [changes/c_move_many/public/test_move_many_public.py]
    new_feature_tests: [changes/c_move_many/private/test_move_many_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_limit+c_undo: reference/limit_undo
  c_move_many: reference/move_many
  c_move_many+c_undo: reference/move_many_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_limit
        planted_bugs:
          - path: bugs/limit_drop_round_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_move_many
      - change: c_undo
        planted_bugs:
          - path: bugs/undo_move_many_lost_check  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
