# ============================================================================
# This is for the RTX 5070 desktop (Windows 11 + WSL2)
#
# Hardware: NVIDIA GeForce RTX 5070 (12 GB), AMD Ryzen 7 9700X (8 cores),
# 15 GB RAM visible to WSL. Runs inside the Ubuntu-24.04 WSL distro, with
# Docker and Ollama installed in that distro (not Docker Desktop). Use it for
# the writer check on the dev tasks. Results from it never go into the
# training data or the report: the 7B model stands in for the 14B editor.
# ============================================================================
#
# Setup (once, inside WSL): Ollama with Qwen2.5-Coder-7B-Instruct and an
# 8192-token context variant (same as noahs_laptop.yaml):
#
#     ollama pull qwen2.5-coder:7b-instruct
#     curl -s http://localhost:11434/api/create -d '{"model": "qwen2.5-coder-7b-ctx8k",
#         "from": "qwen2.5-coder:7b-instruct", "parameters": {"num_ctx": 8192}}'
#
# Usage (from harness/, inside WSL):
#     uv run python -m harness collect --config configs/rtx5070_pc.yaml --until initial
extends: base.yaml
name: rtx5070-pc
runs_dir: ../runs/rtx5070_pc  # its own store, apart from every other config
tasks:
  include: [bank_ledger, course_enrollment, football_season, library_catalog,
            lru_cache, parking_garage, shopping_cart, team_roster]   # the 8 dev tasks
writer:
  backend:
    kind: openai_compat
    model: qwen2.5-coder-7b-ctx8k
    base_url: http://localhost:11434/v1
    fixtures: null           # clear the mock fixtures inherited from base.yaml
    temperature: 0.4         # the pilot: 0.8 gave 0 of 16 passing, 0.4 gave 6 of 16
    request_timeout_s: 300
editor:
  backend:
    kind: openai_compat
    model: qwen2.5-coder-7b-ctx8k  # stand-in for the 14B editor
    base_url: http://localhost:11434/v1
    fixtures: null
    request_timeout_s: 300
execution:
  sandbox_workers: 4         # leaves CPU for Ollama
