# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
# History suite (see ../HISTORY_SUITE.md): undo in both sequences.
schema_version: 1
id: cargo_holds
family: cargo_holds
split: train
entry_files: [ship.py]
spec: spec.md
public_checks: [public/test_ship_public.py]
private_tests: [private/test_ship_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_unseen_cargo_key_error, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_capacity
    kind: validation_rule
    request: changes/c_capacity/request.md
    public_checks: [changes/c_capacity/public/test_capacity_public.py]
    new_feature_tests: [changes/c_capacity/private/test_capacity_new.py]
  - id: c_moves
    kind: atomic_operation
    request: changes/c_moves/request.md
    public_checks: [changes/c_moves/public/test_moves_public.py]
    new_feature_tests: [changes/c_moves/private/test_moves_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_capacity+c_undo: reference/capacity_undo
  c_moves: reference/moves
  c_moves+c_undo: reference/moves_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_capacity
        planted_bugs:
          - path: bugs/capacity_seal_hold_not_undoable  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_moves
      - change: c_undo
        planted_bugs:
          - path: bugs/moves_plan_checked_against_start  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
