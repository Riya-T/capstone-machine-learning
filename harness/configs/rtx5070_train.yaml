# Data collection on the 36 train tasks, with the settings frozen after the
# dev calibration. Same machine, models and store as rtx5070_pc.yaml; only
# the task list differs, so results already in the store are reused.
#
# Usage (from harness/, inside WSL):
#     uv run python -m harness collect --config configs/rtx5070_train.yaml --until initial
#     uv run python -m harness collect --config configs/rtx5070_train.yaml      # also edit
extends: rtx5070_pc.yaml
name: rtx5070-train
tasks:
  include: [
    access_control, budget_envelopes, calendar_events, chat_rooms, clinic_appointments,
    document_store, event_bus, feature_flags, gradebook, gym_memberships,
    hangman_games, high_scores, hotel_rooms, io_meter, iou_tracker,
    job_board, job_queue, login_sessions, movie_bookings, order_workflow,
    pantry_inventory, party_inventory, playlist_manager, recipe_box, restaurant_orders,
    ring_buffer, robot_fleet, school_roster, staff_directory, stock_portfolio,
    thermostat_zones, ticket_desk, token_bucket, url_shortener, vending_machine,
    warehouse_stock,
  ]
