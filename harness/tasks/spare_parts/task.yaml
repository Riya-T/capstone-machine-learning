# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: spare_parts
family: spare_parts
split: eval
entry_files: [parts.py]
spec: spec.md
public_checks: [public/test_parts_public.py]
private_tests: [private/test_parts_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_merge_overwrites_counts, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_undo
    kind: undo
    request: changes/c_undo/request.md
    public_checks: [changes/c_undo/public/test_undo_public.py]
    new_feature_tests: [changes/c_undo/private/test_undo_new.py]
  - id: c_frozen
    kind: state_flag
    request: changes/c_frozen/request.md
    public_checks: [changes/c_frozen/public/test_frozen_public.py]
    new_feature_tests: [changes/c_frozen/private/test_frozen_new.py]
  - id: c_take_kit
    kind: atomic_operation
    request: changes/c_take_kit/request.md
    public_checks: [changes/c_take_kit/public/test_take_kit_public.py]
    new_feature_tests: [changes/c_take_kit/private/test_take_kit_new.py]
  - id: c_versions
    kind: concurrency_control
    request: changes/c_versions/request.md
    public_checks: [changes/c_versions/public/test_versions_public.py]
    new_feature_tests: [changes/c_versions/private/test_versions_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_undo: reference/undo
  c_frozen+c_undo: reference/frozen_undo
  c_frozen+c_undo+c_versions: reference/frozen_undo_versions
  c_take_kit: reference/take_kit
  c_take_kit+c_undo: reference/take_kit_undo
  c_frozen+c_take_kit+c_undo: reference/frozen_take_kit_undo

sequences:
  - id: s1
    steps:
      - change: c_undo
      - change: c_frozen
      - change: c_versions
        planted_bugs:
          - path: bugs/versions_merge_ignores_frozen_into  # required regression bug: breaks step 2
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_take_kit
      - change: c_undo
      - change: c_frozen
        planted_bugs:
          - path: bugs/frozen_kit_takes_part_by_part  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
