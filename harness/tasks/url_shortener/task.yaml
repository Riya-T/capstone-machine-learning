# Paths are relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: url_shortener
family: url_shortener
split: train
entry_files: [shortener.py]
spec: spec.md
public_checks: [public/test_shortener_public.py]
private_tests: [private/test_shortener_initial.py]
reference: reference/v0
planted_bugs:
  # Required: a bug only the hidden initial tests catch.
  - {path: bugs/v0_set_target_unchecked, must_fail: [initial], must_pass: [public]}
  - {path: bugs/v0_ties_reversed, must_fail: [initial], must_pass: [public]}

changes:
  - id: c_disable
    kind: state_flag
    request: changes/c_disable/request.md
    public_checks: [changes/c_disable/public/test_disable_public.py]
    new_feature_tests: [changes/c_disable/private/test_disable_new.py]
  - id: c_stats
    kind: derived_value
    request: changes/c_stats/request.md
    public_checks: [changes/c_stats/public/test_stats_public.py]
    new_feature_tests: [changes/c_stats/private/test_stats_new.py]
  - id: c_alias
    kind: validation_rule
    request: changes/c_alias/request.md
    public_checks: [changes/c_alias/public/test_alias_public.py]
    new_feature_tests: [changes/c_alias/private/test_alias_new.py]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
references:
  c_disable: reference/disable
  c_disable+c_stats: reference/disable_stats
  c_alias: reference/alias
  c_alias+c_disable: reference/alias_disable

sequences:
  - id: s1
    steps:
      - change: c_disable
      - change: c_stats
        planted_bugs:
          - path: bugs/stats_drop_disabled_check  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_alias
      - change: c_disable
        planted_bugs:
          - path: bugs/disable_breaks_case_lookup  # required regression bug: breaks step 1
            must_fail: [existing]
            must_pass: [new_feature]
