# Example task for the tests (not part of the real task set). Paths are
# relative to this directory. The writer sees only `spec` and
# `public_checks`; everything else stays hidden from it.
schema_version: 1
id: record_store
family: record_store
split: train
entry_files: [records.py]
spec: spec.md
public_checks: [public/test_public.py]
# The hidden initial tests skip two rules the spec states (add() storing a
# copy of the record, and a non-str email raising ValidationError), so the
# pilot's 7B writer could reach the editing step. A real task should test
# every rule in its spec.
private_tests: [private/test_initial.py]
reference: reference/v0
planted_bugs:
  - {path: bugs/v0_no_persist, must_fail: [initial, public]}

changes:
  - id: c_conflict
    kind: concurrency_control
    request: changes/c_conflict/request.md
    public_checks: [changes/c_conflict/public/test_conflict_public.py]
    new_feature_tests: [changes/c_conflict/private/test_conflict_new.py]
  - id: c_txn
    kind: atomicity
    request: changes/c_txn/request.md
    public_checks: [changes/c_txn/public/test_txn_public.py]
    new_feature_tests: [changes/c_txn/private/test_txn_new.py]
  - id: c_unique
    kind: validation_rule
    request: changes/c_unique/request.md
    public_checks: [changes/c_unique/public/test_unique_public.py]
    new_feature_tests: [changes/c_unique/private/test_unique_new.py]
    supersedes: ["private/test_initial.py::test_duplicate_emails_are_allowed"]

# Reference solutions by the set of changes applied (sorted ids joined by "+").
# Any sequence that reaches the same set uses the same reference; a step can
# override this with its own `reference` when order matters.
references:
  c_conflict: reference/conflict
  c_conflict+c_txn: reference/conflict_txn
  c_unique: reference/unique
  c_conflict+c_unique: reference/conflict_unique

sequences:
  - id: s1
    steps:
      - change: c_conflict
        planted_bugs:
          - path: bugs/conflict_nonatomic_update
            must_fail: [existing, public]
            must_pass: [new_feature]
      - change: c_txn
        planted_bugs:
          - path: bugs/txn_drops_conflict     # step 2 silently drops step 1's behavior
            must_fail: [existing, public]
            must_pass: [new_feature]
  - id: s2
    steps:
      - change: c_unique
      - change: c_conflict
